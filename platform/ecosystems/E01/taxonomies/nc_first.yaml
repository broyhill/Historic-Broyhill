# Existing E01 brain.triggers (extend only). proposed = not inserted.
triggers:
  existing:
    - donor.grade_changed
    - donor.score_recalculated
    - donor.upgrade_opportunity
    - donor.lapsed_detected
    - donor.maxout_approaching
    - donor.vip_threshold_crossed
    - donor.first_gift
    - donor.recurring_started
  proposed_nc_first:
    - donor.ncboe_new_filing
    - donor.fec_cand_id_gift
    - donor.county_silo_entered
    - donor.maxout_nc_cycle
  catalog: brain.triggers
  do_not_create: parallel_trigger_table
