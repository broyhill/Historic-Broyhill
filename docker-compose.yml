version: '3.8'
services:
  postgres:
    image: ankane/pgvector:latest
    container_name: broyhill-postgres
    environment:
      POSTGRES_USER: broyhill_admin
      POSTGRES_PASSWORD: enterprise_secure_pass123
      POSTGRES_DB: historic_broyhill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - broyhill-network

  redis:
    image: redis:7-alpine
    container_name: broyhill-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - broyhill-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: broyhill-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - broyhill-network

volumes:
  pgdata:
  redisdata:

networks:
  broyhill-network:
    driver: bridge
